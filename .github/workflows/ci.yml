name: CI

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-test:
    name: ${{ matrix.os }} | ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 14 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 gfortran-14

      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Install GCC (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          # Expose the gfortran binary path (version-suffixed on Homebrew)
          GFORTRAN_BIN=$(ls "$(brew --prefix)/bin"/gfortran-* | head -n1)
          echo "GFORTRAN=${GFORTRAN_BIN}" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'include/**', 'examples/**', 'tests/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.build_type }}-
            ${{ runner.os }}-ccache-

      - name: Configure CMake (Linux, GCC 14)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14

      - name: Configure CMake (macOS, Clang)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=${{ env.GFORTRAN }}

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Show compiler versions (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc-14 --version
          g++-14 --version

      - name: Show compiler versions (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          clang++ --version
          if [ -n "${GFORTRAN}" ] && [ -x "${GFORTRAN}" ]; then ${GFORTRAN} --version; fi

      - name: ccache stats
        run: ccache -s || true

      - name: Run tests (ctest)
        run: |
          ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

  cuda-build:
    name: CUDA build (Ubuntu)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.0.1-devel-ubuntu22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential g++ gfortran cmake ccache git
          nvcc --version

      - name: Configure (enable CUDA)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_CUDA_ARCHITECTURES=90 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build CUDA target
        run: cmake --build build --target test_vode_gpu --parallel

      - name: List built tests
        run: ctest --test-dir build -N || true


